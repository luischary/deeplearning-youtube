[project]
name = "sgd-video-experiments"
version = "0.1.0"
description = "Experimentos reproduzíveis para o vídeo sobre gradiente descendente"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "torch>=2.5",
  "torchvision>=0.20",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sgd_video_experiments"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
